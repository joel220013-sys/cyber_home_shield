name: Continuous Integration & Test Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite (228 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/ -v --tb=short
        env:
          ENVIRONMENT: testing
          DEBUG: true
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          HONEYPOT_ENABLED: false
          HONEYPOT_BIND_HOST: 127.0.0.1
          HONEYPOT_ALLOW_NON_LOCAL: false

  frontend-checks:
    name: Frontend Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build
